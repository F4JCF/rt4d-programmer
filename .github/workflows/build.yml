name: Compilation Windows + Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: RT4D-Programmer-Windows
            exe: RT4D-Programmer.exe
          - os: ubuntu-22.04
            name: RT4D-Programmer-Linux
            exe: RT4D-Programmer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller
      - name: Compilation PyInstaller
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RT4D-Programmer
          --icon icon.ico
          --add-data "icon.png:."
          --collect-submodules serial.tools
          --collect-data certifi
          main.py
      - name: Paquet
        shell: bash
        run: |
          mkdir out
          cp "dist/${{ matrix.exe }}" out/
          cp README.md LICENSE NOTICE out/
          cd out
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.name }}.zip" . > /dev/null
          else
            chmod +x "${{ matrix.exe }}"
            zip -r "../${{ matrix.name }}.zip" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    # Publication automatique : à chaque envoi sur main, si la version indiquée dans
    # rt4dprog/__init__.py n'a pas encore de release, le tag vX.Y.Z et la release
    # sont créés avec les deux zips. Un tag poussé à la main fonctionne aussi.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rt4dprog/__init__.py)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "La release $TAG existe déjà : rien à publier."
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'yes'
        with:
          path: dl
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'yes'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RT4D Programmer ${{ steps.v.outputs.tag }}
          files: dl/*/*.zip
          body: |
            Téléchargez le zip correspondant à votre système, décompressez-le et lancez le programme.
            Windows : RT4D-Programmer.exe — Linux : RT4D-Programmer (rendez-le exécutable si besoin).
