name: Compilation Windows + Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: RT4D-Programmer-Windows
            exe: RT4D-Programmer.exe
          - os: ubuntu-22.04
            name: RT4D-Programmer-Linux
            exe: RT4D-Programmer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller
      - name: Bibliothèques Linux embarquées (xcb-cursor, absente de Linux Mint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0
          echo "EXTRA_BIN=--add-binary /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0:." >> "$GITHUB_ENV"
      - name: Compilation PyInstaller
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RT4D-Programmer
          --icon icon.ico
          --add-data "icon.png:."
          $EXTRA_BIN
          --collect-submodules serial.tools
          --collect-data certifi
          main.py
      - name: Test de démarrage Linux (sans libxcb-cursor0 installée, comme sur Linux Mint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb
          sudo apt-get remove -y -qq libxcb-cursor0
          set +e
          HOME=$(mktemp -d) timeout 15 xvfb-run -a dist/RT4D-Programmer > start.log 2>&1
          code=$?
          cat start.log
          # 124 = toujours en marche au bout de 15 s : l'interface a démarré
          [ "$code" = "124" ] || { echo "Le logiciel ne démarre pas (code $code)"; exit 1; }
      - name: Installateur Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path rt4dprog/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=$v" installer.iss
      - name: Paquet
        shell: bash
        run: |
          mkdir out rel
          cp "dist/${{ matrix.exe }}" out/
          cp README.md LICENSE NOTICE out/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/RT4D-Programmer.exe rel/RT4D-Programmer.exe
            cp dist/RT4D-Programmer-Setup-*.exe rel/
            (cd out && 7z a "../rel/${{ matrix.name }}.zip" . > /dev/null)
          else
            chmod +x "out/${{ matrix.exe }}"
            cp install.sh icon.png out/
            chmod +x out/install.sh
            cp out/RT4D-Programmer rel/RT4D-Programmer-Linux
            (cd out && zip -r "../rel/${{ matrix.name }}.zip" .)
          fi
          ls -l rel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rel/*

  release:
    # Publication automatique : à chaque envoi sur main, si la version indiquée dans
    # rt4dprog/__init__.py n'a pas encore de release, le tag vX.Y.Z et la release
    # sont créés avec les deux zips. Un tag poussé à la main fonctionne aussi.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rt4dprog/__init__.py)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "La release $TAG existe déjà : rien à publier."
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Notes de version (message du dernier commit)
        if: steps.v.outputs.publish == 'yes'
        run: |
          {
            echo "## Nouveautés"
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D'
            echo
            echo "Windows : installez avec RT4D-Programmer-Setup (ou lancez directement RT4D-Programmer.exe)."
            echo "Linux : RT4D-Programmer-Linux (rendez-le exécutable)."
            echo "Les versions déjà installées proposent la mise à jour automatiquement (menu « Mise à jour »)."
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'yes'
        with:
          path: dl
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'yes'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RT4D Programmer ${{ steps.v.outputs.tag }}
          files: dl/*/*
          body_path: notes.md
